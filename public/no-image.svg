<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#0C241C"/>
  <g opacity="0.04">
    <path d="M0 0H800V600H0z" fill="url(#grid)"/>
  </g>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C275"/>
      <stop offset="50%" stop-color="#C9A24E"/>
      <stop offset="100%" stop-color="#9A7B31"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163E32"/>
      <stop offset="100%" stop-color="#091C16"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <g transform="translate(400, 250)">
    <rect x="-65" y="-55" width="130" height="95" rx="14" fill="url(#badge-grad)" stroke="url(#gold-grad)" stroke-width="2"/>
    <path d="M-40 20 L-15 -15 L 5 5 L 20 -8 L 40 20 Z" fill="#C9A24E" opacity="0.25"/>
    <circle cx="20" cy="-25" r="8" fill="#C9A24E" opacity="0.35"/>
    <circle cx="0" cy="-5" r="28" fill="#0C241C" stroke="url(#gold-grad)" stroke-width="2"/>
    <path d="M-12 -12 L12 12" stroke="#E6C275" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 8 L10 -8" stroke="#E6C275" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
  <text x="400" y="375" text-anchor="middle" fill="#F7F4EC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="2.5">IMAGE NOT UPLOADED</text>
  <text x="400" y="405" text-anchor="middle" fill="#C9A24E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3">ATHARVA REAL INFRA</text>
  <text x="400" y="440" text-anchor="middle" fill="#8B9E95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Media preview will be displayed once uploaded</text>
</svg>
